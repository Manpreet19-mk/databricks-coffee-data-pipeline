      queue:
        enabled: true
      parameters:
        - name: catalog
          default: coffee
        - name: bronze_schema
          default: bronze
        - name: silver_schema
          default: silver
        - name: default_watermark
          default: 1900-01-01
      performance_target: PERFORMANCE_OPTIMIZED
