resources:
  jobs:
    silver_ingestion:
      name: silver_ingestion
      email_notifications:
        on_failure:
          - projectdilpreet@gmail.com
      tasks:
        - task_key: column_standardising_udf
          notebook_task:
            notebook_path: /Workspace/Users/projectdilpreet@gmail.com/vstone-databricks-pipeline/src/notebooks/silver/Silver_utils/Column_standardization_udf
            source: WORKSPACE
        - task_key: silver_menu_items
          depends_on:
            - task_key: column_standardising_udf
          notebook_task:
            notebook_path: /Workspace/Users/projectdilpreet@gmail.com/vstone-databricks-pipeline/src/notebooks/silver/silver_menu_items
            base_parameters:
              source_table: menu_items
            source: WORKSPACE
          max_retries: 2
          min_retry_interval_millis: 60000
          disable_auto_optimization: false
        - task_key: silver_payment_methods
          depends_on:
            - task_key: column_standardising_udf
